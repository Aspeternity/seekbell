# SeekBell 0.6.0; schema 0018. Back up the complete data volume before upgrading.
# GitHub Release assets pin this version to the verified image digest.
# Portainer standalone Docker Stack. Update the existing stack to retain its volume.
services:
  seekbell:
    image: ghcr.io/aspeternity/seekbell:0.6.0
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    volumes:
      - seekbell_data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  seekbell_data:
