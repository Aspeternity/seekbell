# SeekBell 0.9.2; schema 0023. Back up the data before upgrading.
# Portainer: update the existing stack to keep its data. Reverse proxy and optional
# hardening: docs/PROXY_DEPLOYMENT.md, docs/IMAGE_RELEASE.md.
services:
  seekbell:
    image: ghcr.io/aspeternity/seekbell:0.9.2
    container_name: seekbell
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - seekbell_data:/data
      # Or any host directory, no permission setup needed: - /opt/seekbell/data:/data

volumes:
  seekbell_data:
