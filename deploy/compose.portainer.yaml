# Published hotlist-20261028; migration 0017. Back up the complete data volume before upgrading.
# Portainer standalone Docker Stack. Update the existing stack to retain its volume.
services:
  seekbell:
    image: ghcr.io/aspeternity/seekbell:hotlist-20261028@sha256:abb0a56e6c2b648b49348cb697207d8afd7a53b4517020b14c0a6cddfad8aeb5
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    volumes:
      - seekbell_data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  seekbell_data:
