[project]
name = "seekbell"
version = "0.1.0.dev0"
description = "Self-hosted NodeSeek RSS monitoring and notifications"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20,<2",
  "cryptography>=46,<47",
  "defusedxml>=0.7.1,<0.8",
  "fastapi>=0.143.5,<0.144",
  "feedparser>=6.0.14,<7",
  "httpx[http2]>=0.28.1,<0.29",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1.5,<2.2",
  "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.1,<0.18"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/seekbell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
