services:
  seekbell:
    image: ${SEEKBELL_IMAGE:?Set SEEKBELL_IMAGE to a fixed commit tag or digest}
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${SEEKBELL_PORT:-8000}:8000"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  data:
