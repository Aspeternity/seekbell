name: Local baseline checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - run: python scripts/check_privacy.py
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m seekbell.services.demo
      - run: uv run --frozen python -m seekbell.services.runtime_demo
      - run: uv run --frozen python -m seekbell.services.backup_demo
      - run: uv build --wheel
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend build
      - name: Prefer Ubuntu archives and bound browser dependency downloads
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          mirrors = Path("/etc/apt/apt-mirrors.txt")
          if mirrors.is_file():
              mirrors.write_text(
                  "https://archive.ubuntu.com/ubuntu/\tpriority:1\n"
                  "https://security.ubuntu.com/ubuntu/\tpriority:2\n"
                  "http://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n"
              )
          Path("/etc/apt/apt.conf.d/99seekbell-ci-network").write_text(
              'Acquire::Retries "2";\n'
              'Acquire::http::Timeout "30";\n'
              'Acquire::https::Timeout "30";\n'
          )
          PY
          timeout --signal=TERM --kill-after=10s 4m pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:ui
      - run: pnpm --dir frontend test:live
      - run: pnpm --dir frontend test:history
      - run: pnpm --dir frontend test:loading
      - run: pnpm --dir frontend test:history-ui-fixes
      - run: pnpm --dir frontend test:content-stability
      - run: pnpm --dir frontend test:workspace-stability
      - run: pnpm --dir frontend test:first-entry
      - run: pnpm --dir frontend test:hotlist
      - run: pnpm --dir frontend test:approved-ui
      - run: pnpm --dir frontend test:sending
      - run: pnpm --dir frontend test:runtime
      - run: pnpm --dir frontend test:operations
      - run: pnpm --dir frontend test:retention
      - run: pnpm --dir frontend test:system
      - run: pnpm --dir frontend test:backup
      - name: Verify migration commands
        env:
          SEEKBELL_DATA_DIR: ${{ runner.temp }}/seekbell-data
        run: |
          uv run --frozen python -m seekbell.db upgrade
          uv run --frozen python -m seekbell.db current
          uv run --frozen python -m seekbell.db check
      - name: Build container without publishing
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t seekbell:ci .
      - name: Check packaged service without external networking
        run: python scripts/check_container.py seekbell:ci --revision "$GITHUB_SHA"
      - name: Rehearse Compose and independent encrypted restore offline
        run: python scripts/check_backup_container.py seekbell:ci --revision "$GITHUB_SHA"
      - name: Rehearse isolated volume switch and explicit rollback offline
        run: python scripts/check_release_container.py seekbell:ci --revision "$GITHUB_SHA"
      - name: Load pinned external proxy for isolated TLS rehearsal
        run: docker pull nginx@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
      - name: Rehearse actual HTTPS proxy and streaming without external egress
        run: python scripts/check_proxy_container.py seekbell:ci --revision "$GITHUB_SHA"
      - name: Check browser login through actual HTTPS proxy
        env:
          SEEKBELL_IMAGE: seekbell:ci
          SEEKBELL_REVISION: ${{ github.sha }}
        run: pnpm --dir frontend test:proxy

  native-candidates:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') }}
    needs: baseline
    uses: ./.github/workflows/native-images.yml
    permissions:
      contents: read
