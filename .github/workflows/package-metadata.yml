name: Inspect existing private package metadata
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read safe package linkage fields without changing the package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              request = urllib.request.Request('https://api.github.com/' + path, headers=headers)
              with opener.open(request, timeout=30) as response:
                  return json.load(response)
          repo = get('repos/Aspeternity/seekbell')
          package = get('users/Aspeternity/packages/container/seekbell')
          linked = package.get('repository')
          print(json.dumps({'repo': {key: repo.get(key) for key in ['id', 'full_name', 'private']},
                            'package': {key: package.get(key) for key in ['name', 'package_type', 'visibility']},
                            'linked_keys': sorted(linked) if isinstance(linked, dict) else None,
                            'linked': {key: linked.get(key) for key in ['id', 'name', 'full_name', 'private']} if isinstance(linked, dict) else linked}))
          PYCODE
