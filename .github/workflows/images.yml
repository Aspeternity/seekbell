name: Versioned images and manual candidates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character SHA of the selected branch commit
        required: true
        type: string
      publish:
        description: Explicitly publish tested candidates to GHCR (requires repository opt-in)
        type: boolean
        default: false
      tag:
        description: Optional short candidate tag (latest is not allowed)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: image-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      repository: ${{ steps.identity.outputs.repository }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check selected revision, release version and publication intent
        id: identity
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          ENABLED: ${{ vars.SEEKBELL_GHCR_ENABLED }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHORT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path
          from scripts.release_images import version_tags
          version = ''
          if os.environ['GITHUB_EVENT_NAME'] == 'release':
              version = os.environ['RELEASE_TAG']
              version_tags(version)
              assert os.environ['GITHUB_REF'] == 'refs/tags/' + version
              subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['GITHUB_SHA'],
                              'origin/' + os.environ['DEFAULT_BRANCH']], check=True)
              expected = re.sub(r'-(alpha|beta|rc)\.([1-9][0-9]*)',
                                lambda m: {'alpha':'a', 'beta':'b', 'rc':'rc'}[m[1]] + m[2],
                                version[1:])
              actual = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
              assert actual == expected, 'Bump pyproject.toml and uv.lock before creating the release'
              assert ('-' in version) == (os.environ['PRERELEASE'] == 'true'), 'Release prerelease flag mismatch'
          else:
              revision = os.environ['EXPECTED_REVISION']
              assert re.fullmatch('[0-9a-f]{40}', revision), 'Use a full commit SHA'
              assert revision == os.environ['GITHUB_SHA'], 'Selected branch has a different commit'
              tag = os.environ['SHORT_TAG']
              if tag:
                  assert len(tag) <= 64 and re.fullmatch(r'[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*', tag) and tag != 'latest', 'Invalid short candidate tag'
                  assert os.environ['PUBLISH'] == 'true', 'A short tag requires publication'
              if os.environ['PUBLISH'] == 'true':
                  assert os.environ['ENABLED'] == 'true', 'Manual candidate publication is not enabled'
                  assert os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['DEFAULT_BRANCH'], 'Publish from the default branch only'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + os.environ['GITHUB_REPOSITORY'].lower() + '\n')
              output.write('version=' + version + '\n')
          PY
      - name: Check package access and public destination before building a publication candidate
        if: ${{ github.event_name == 'release' || inputs.publish }}
        env:
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_package.py --repository "$IMAGE_REPOSITORY" --visibility public --repository-visibility public

  # Skipped inside ci.yml when this exact tree already passed (normally the
  # merged PR); native builds run in parallel because bytes depend on the SHA.
  baseline:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  native:
    needs: preflight
    uses: ./.github/workflows/native-images.yml
    permissions:
      contents: read

  publish:
    if: ${{ github.event_name == 'release' || inputs.publish }}
    needs: [preflight, baseline, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.preflight.outputs.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-amd64
          path: ${{ runner.temp }}/images/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-arm64
          path: ${{ runner.temp }}/images/arm64
      - name: Verify both artifacts before registry authentication
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            release --artifacts "$RUNNER_TEMP/images" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --report plan.json
      - name: Verify public source repository and public package before any registry write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_package.py --repository "$IMAGE_REPOSITORY" --visibility public --repository-visibility public
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested bytes and verify immutable two-platform index
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            release --artifacts "$RUNNER_TEMP/images" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --execute --report release.json
      - name: Confirm published package remains public and record reported linkage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_package.py --repository "$IMAGE_REPOSITORY" --visibility public --repository-visibility public --wait-seconds 30 > package.json
      - name: Pull immutable registry image and check it without external networking
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path
          from scripts.release_images import DIGEST
          report = json.loads(Path('release.json').read_text())
          assert report['published'] and report['revision'] == os.environ['GITHUB_SHA']
          assert DIGEST.fullmatch(report['digest'])
          assert report['reference'] == 'ghcr.io/' + os.environ['IMAGE_REPOSITORY'] + '@' + report['digest']
          subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', report['reference']], check=True)
          subprocess.run(['python3', 'scripts/check_container.py', report['reference'], '--revision', os.environ['GITHUB_SHA']], check=True)
          PYCODE
      - name: Add explicit short tag after all image checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          SHORT_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            alias --receipt release.json --tag "$SHORT_TAG" --execute --report alias.json
      - name: Add version and latest tags only after all image checks
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from scripts.release_images import promote
          version = os.environ['RELEASE_VERSION']
          latest = False
          if '-' not in version:
              response = subprocess.run(
                  ['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/latest'],
                  capture_output=True, text=True)
              selected = json.loads(response.stdout)
              if response.returncode:
                  assert str(selected.get('status')) == '404', 'Cannot determine latest release'
              else:
                  latest = selected['tag_name'] == version
          report = promote(json.loads(Path('release.json').read_text()),
                           os.environ['GITHUB_SHA'], os.environ['IMAGE_REPOSITORY'],
                           version, latest=latest, execute=True)
          Path('version.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Version tags: ' + ', '.join(report['tags']) + '\n\n')
          PY
      - name: Package and validate digest-pinned Portainer release assets
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            compose --receipt version.json --version "$RELEASE_VERSION" --templates deploy --output release-assets
          docker compose -f release-assets/compose.portainer.yaml config --quiet
          docker compose -f release-assets/compose.portainer.compare.yaml config --quiet
      - name: Record pinned deployment reference
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('release.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published candidate: `' + report['reference'] + '`\n\n')
              summary.write('Code: `' + report['revision'] + '`. Deployment and user acceptance remain separate.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && hashFiles('release.json') != '' }}
        with:
          name: image-release-receipt
          path: |
            release.json
            package.json
            alias.json
            version.json
            release-assets/
          if-no-files-found: error
          retention-days: 30
          overwrite: true


  release-receipt:
    if: ${{ github.event_name == 'release' }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-release-receipt
          path: receipt
      - name: Attach permanent image receipts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" receipt/release.json receipt/version.json receipt/package.json receipt/release-assets/deployment.json receipt/release-assets/compose.portainer.yaml receipt/release-assets/compose.portainer.compare.yaml --clobber
      # Final gate: the release is done only when an anonymous user sees
      # matching assets and registry tags, so no manual follow-up check is needed.
      - name: Verify the public release anonymously
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for attempt in 1 2 3; do
            python3 scripts/verify_release.py --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" \
              --repository "$GITHUB_REPOSITORY" --report verification.json && break
            test "$attempt" = 3 && exit 1
            sleep 20
          done
          { echo '### Anonymous release verification'; echo '```json'; cat verification.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
