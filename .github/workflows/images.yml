name: Native image candidates

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character SHA of the selected branch commit
        required: true
        type: string
      publish:
        description: Explicitly publish tested candidates to GHCR (requires repository opt-in)
        type: boolean
        default: false
      tag:
        description: Optional short candidate tag (latest is not allowed)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: image-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      repository: ${{ steps.identity.outputs.repository }}
    steps:
      - name: Check explicit revision and publication opt-in
        id: identity
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          PUBLISH: ${{ inputs.publish }}
          ENABLED: ${{ vars.SEEKBELL_GHCR_ENABLED }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHORT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          revision = os.environ['EXPECTED_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', revision), 'Use a full commit SHA'
          assert revision == os.environ['GITHUB_SHA'], 'Selected branch has a different commit'
          tag = os.environ['SHORT_TAG']
          if tag:
              assert len(tag) <= 64 and re.fullmatch(r'[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*', tag) and tag != 'latest', 'Invalid short candidate tag'
              assert os.environ['PUBLISH'] == 'true', 'A short tag requires publication'
          if os.environ['PUBLISH'] == 'true':
              assert os.environ['ENABLED'] == 'true', 'GHCR publication is not enabled'
              assert os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['DEFAULT_BRANCH'], 'Publish from the default branch only'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + os.environ['GITHUB_REPOSITORY'].lower() + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.publish }}
        with:
          persist-credentials: false
      - name: Check package access and public destination before building a publication candidate
        if: ${{ inputs.publish }}
        env:
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_package.py --repository "$IMAGE_REPOSITORY" --visibility public

  baseline:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  native:
    needs: [preflight, baseline]
    uses: ./.github/workflows/native-images.yml
    permissions:
      contents: read

  publish:
    if: ${{ inputs.publish }}
    needs: [preflight, baseline, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.preflight.outputs.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-amd64
          path: ${{ runner.temp }}/images/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-arm64
          path: ${{ runner.temp }}/images/arm64
      - name: Verify both artifacts before registry authentication
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            release --artifacts "$RUNNER_TEMP/images" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --report plan.json
      - name: Verify private source repository and public package before any registry write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_package.py --repository "$IMAGE_REPOSITORY" --visibility public
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested bytes and verify immutable two-platform index
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            release --artifacts "$RUNNER_TEMP/images" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --execute --report release.json
      - name: Confirm published package remains public and record reported linkage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_ghcr_package.py --repository "$IMAGE_REPOSITORY" --visibility public --wait-seconds 30 > package.json
      - name: Pull immutable registry image and check it without external networking
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path
          from scripts.release_images import DIGEST
          report = json.loads(Path('release.json').read_text())
          assert report['published'] and report['revision'] == os.environ['GITHUB_SHA']
          assert DIGEST.fullmatch(report['digest'])
          assert report['reference'] == 'ghcr.io/' + os.environ['IMAGE_REPOSITORY'] + '@' + report['digest']
          subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', report['reference']], check=True)
          subprocess.run(['python3', 'scripts/check_container.py', report['reference'], '--revision', os.environ['GITHUB_SHA']], check=True)
          PYCODE
      - name: Add explicit short tag after all image checks
        if: ${{ inputs.tag != '' }}
        env:
          SHORT_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_images.py --revision "$GITHUB_SHA" --repository "$IMAGE_REPOSITORY" \
            alias --receipt release.json --tag "$SHORT_TAG" --execute --report alias.json
      - name: Record pinned deployment reference
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('release.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published candidate: `' + report['reference'] + '`\n\n')
              summary.write('Code: `' + report['revision'] + '`. Deployment and user acceptance remain separate.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && hashFiles('release.json') != '' }}
        with:
          name: image-release-receipt
          path: |
            release.json
            package.json
            alias.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
