name: Authorized image build and publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR only after explicit owner authorization
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_privacy.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image coordinates
        id: coordinates
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ steps.coordinates.outputs.image }}:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record build identity
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          echo "Code: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: $PUBLISHED; native arm64 runtime acceptance is separate." >> "$GITHUB_STEP_SUMMARY"
